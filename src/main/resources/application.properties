# ============================================
# Configuração do Banco de Dados (PostgresSQL)
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/biblioteca_ps_emakers
spring.datasource.username=postgres
spring.datasource.password=PS-Emakers-2026
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# Configuração do JPA / Hibernate
# ========================================
# Notas de Aprendizado: 'validate' apenas confere se o banco bate com as entidades
# impedindo que o Hibernate/JPA crie ou altere tabelas sozinho.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Debug no terminal / Mostra o SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =================================
# Configuração do Flyway
# =================================
spring.flyway.enabled=true

# Caminho padrão onde o Flyway vai procurar os arquivos .sql de migração
spring.flyway.locations=classpath:db/migration

# Caso o banco já tenha algum dado antes do Flyway rodar. (Boa prática)
spring.flyway.baseline-on-migrate=true